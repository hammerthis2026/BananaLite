name: Banana Lite Android
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - macos-15
          - macos-26
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android dependencies
        run: |
          if [ "$(uname -s)" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y zsh ninja-build clang lld libicu-dev zlib1g-dev libssl-dev
          else
            command -v ninja || brew install ninja
          fi
          command -v sdkmanager
          sdkmanager --version
          sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Fetch upstream and apply prototype
        run: |
          git clone https://git.eden-emu.dev/moceure/BananaNative upstream
          git -C upstream checkout ba6094da4407247cba31e546ea7d51a747a11a0a
          git -C upstream submodule update --init --recursive
          python3 tools/apply_lite.py upstream
      - name: Build real native packer
        run: zsh upstream/android/ondevice/build.sh "$RUNNER_TEMP/banana-pack"
      - name: Build APK
        working-directory: upstream/android/app
        run: bash ./gradlew -PnxPackStage="$RUNNER_TEMP/banana-pack/stage" apk
      - name: Name APK for this build
        run: |
          VERSION=$(sed -n 's/^nxVersion=//p' upstream/android/app/gradle.properties | tail -1)
          VERSION=${VERSION:-experimental}
          mkdir -p dist
          cp upstream/android/app/out/nxnative-android-bananalite.apk "dist/BananaLite-${VERSION}-build-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}.apk"
          echo "LITE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Sign with persistent release key when configured
        env:
          KEYSTORE_B64: ${{ secrets.BANANALITE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BANANALITE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BANANALITE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BANANALITE_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No persistent signing key configured; APK may not support in-place updates."
            exit 0
          fi
          umask 077
          KS="$RUNNER_TEMP/bananalite-release.jks"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KEYSTORE_B64" | openssl base64 -d -A > "$KS"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for APK in dist/*.apk; do
            "$SIGNER" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK.signed" "$APK"
            "$SIGNER" verify --print-certs "$APK.signed"
            mv "$APK.signed" "$APK"
            rm -f "$APK.signed.idsig"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: BananaLite-${{ env.LITE_VERSION }}-build-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: dist/*.apk
          if-no-files-found: error
